name: deploy

# CD to the dev environment (ADR-0008, ADR-0011, ADR-0012): a throwaway Floci with EKS on the
# runner, the same infrastructure as the infra smoke test, then the rendered manifests pinned to
# each service's content-hash tag. Passing means every rollout completed and the frontend answers.
#
# Rollback: run this workflow by hand with `rev` set to an earlier commit; the manifests are
# rendered at that revision, so they reference the tags that revision was deployed with.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/deploy.yml
      - .github/scripts/render-manifests.sh
      - .github/scripts/content-tag.sh
      - deploy/**
  workflow_dispatch:
    inputs:
      rev:
        description: "Commit to render and deploy (default: the selected ref's head; older = rollback)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ENV_DIR: infra/environments/floci
  COMPOSE_FILE: infra/environments/floci/compose.yaml
  CLUSTER: yaaf-floci
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Start Floci
        run: |
          docker compose up -d floci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4566/_floci/health >/dev/null && exit 0
            sleep 2
          done
          echo "Floci did not become healthy"; exit 1

      - name: Apply the environment
        working-directory: ${{ env.ENV_DIR }}
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve

      # Floci's EKS auth rejects test/test, so mint a real IAM key in Floci (see kubectl-setup.ps1).
      - name: Point kubectl at the cluster
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          aws iam create-user --user-name kubectl-ci >/dev/null
          read -r AK SK < <(aws iam create-access-key --user-name kubectl-ci \
            --query 'AccessKey.[AccessKeyId,SecretAccessKey]' --output text)
          echo "::add-mask::$SK"
          {
            echo "AWS_ENDPOINT_URL=http://localhost:4566"
            echo "AWS_ACCESS_KEY_ID=$AK"
            echo "AWS_SECRET_ACCESS_KEY=$SK"
          } >> "$GITHUB_ENV"
          AWS_ACCESS_KEY_ID=$AK AWS_SECRET_ACCESS_KEY=$SK aws eks update-kubeconfig --name "$CLUSTER"

      # A separate step: the new key reaches it through GITHUB_ENV, not the step above.
      - name: Wait for a Ready node
        run: kubectl wait --for=condition=Ready node --all --timeout=300s

      - name: Render the manifests
        env:
          REV: ${{ inputs.rev || 'HEAD' }}
        run: |
          bash .github/scripts/render-manifests.sh deploy/dev "$REV" > rendered.yaml
          {
            echo "Rendered at \`$(git rev-parse --short "$REV")\`:"
            echo '```'
            grep -o 'image: ghcr.io[^ ]*' rendered.yaml | sort -u
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-manifests
          path: rendered.yaml

      - name: Deploy and wait for every rollout
        run: |
          kubectl apply -f rendered.yaml
          for d in $(kubectl get deployments -o name); do
            kubectl rollout status "$d" --timeout=300s
          done
          kubectl get pods -o wide

      # The frontend needs its backends to render the home page, so a 200 with the shop title
      # exercises the service-to-service path.
      - name: Smoke check the frontend
        run: |
          kubectl port-forward svc/frontend 8080:80 >/tmp/portforward.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/_healthz >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/_healthz
          curl -sf http://localhost:8080/ | grep -q "Online Boutique"
          echo "frontend OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes,pods -A -o wide || true
          kubectl describe pods | tail -150 || true
          docker compose logs floci | tail -100

      - name: Destroy
        if: always()
        working-directory: ${{ env.ENV_DIR }}
        run: tofu destroy -input=false -auto-approve

      # COMPOSE_FILE is relative to the repo root, so this step runs there.
      - name: Stop Floci
        if: always()
        run: docker compose down -v
