name: reusable-container-image

# Builds, scans and (on main only) publishes one container image, with SLSA provenance and an SBOM (ADR-0024). Called by
# build.yml once per changed service; a new service needs a folder with a Dockerfile, not a new pipeline.
#
#   pull request: build, scan, gate. Never pushes: an image that can reach the cluster is built by main only.
#   main:         the same, then push by digest, attest provenance and SBOM. An image whose content tag already exists
#                 is reused, since it was built by main from the same source.
on:
  workflow_call:
    inputs:
      service:
        description: Service name; the image is ghcr.io/<owner>/<repo>/<service>.
        type: string
        required: true
      context:
        description: Build context (the folder with the Dockerfile).
        type: string
        required: true
      publish:
        description: Push, attest and upload scan results. True only for pushes to main.
        type: boolean
        required: true
    outputs:
      digest:
        description: The published image digest (empty when not publishing).
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

env:
  # Trivy itself is pinned (the action's own default, v0.70.0, has GHSA-mcj4-mphf-j9ff); bump deliberately.
  TRIVY_VERSION: v0.74.0

jobs:
  image:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      security-events: write # upload scan results to the Security tab
      id-token: write # sign attestations with Sigstore
      attestations: write # store attestations on GitHub
    outputs:
      digest: ${{ steps.publish.outputs.digest || steps.existing.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.service }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTEXT: ${{ inputs.context }}
      # Uploading scan results needs a token that can write security events, which fork PRs never get.
      UPLOAD: ${{ inputs.publish || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: tag
        run: echo "content=$(bash .github/scripts/content-tag.sh "$CONTEXT")" >> "$GITHUB_OUTPUT"

      # On main, reuse an image whose content tag exists: pull requests never push, so it was built by main from the
      # same source and already carries its attestations.
      - id: existing
        if: inputs.publish
        env:
          CONTENT_TAG: ${{ steps.tag.outputs.content }}
        run: |
          if digest="$(docker buildx imagetools inspect "$IMAGE:$CONTENT_TAG" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" && [ -n "$digest" ]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$CONTENT_TAG exists ($digest); reusing it" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once and loaded, so the image that is scanned is the image that is pushed (the push reuses this build's
      # layers from the cache).
      - if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      # Report: HIGH and CRITICAL to the Security tab, never failing.
      - if: steps.existing.outputs.digest == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}:${{ env.SHA }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - if: steps.existing.outputs.digest == '' && env.UPLOAD == 'true' && !cancelled()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.service }}

      # Gate: any fixable CRITICAL that is not an accepted, unexpired entry in .trivyignore.yaml fails the build.
      - if: steps.existing.outputs.digest == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}:${{ env.SHA }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - if: inputs.publish && steps.existing.outputs.digest == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publish
        if: inputs.publish && steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          push: true
          # Provenance comes from actions/attest below, stored on GitHub rather than as extra registry manifests.
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.content }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.title=${{ inputs.service }}
          cache-from: type=gha,scope=${{ inputs.service }}

      - if: steps.publish.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}@${{ steps.publish.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      # SLSA build provenance: which workflow, commit and runner produced this digest.
      - if: steps.publish.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}

      - if: steps.publish.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.cdx.json

      - if: steps.publish.outputs.digest != ''
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "Published \`$IMAGE@$DIGEST\` with SLSA provenance and a CycloneDX SBOM."
            echo "Verify: \`gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"
