name: infra

# Validates infrastructure changes (ADR-0007). `plan` runs without Floci. The smoke test applies
# the whole Floci environment from scratch, requires a clean re-plan, then destroys it. Floci
# proves the code applies; it does not prove IAM trust or other security properties (ADR-0006).
#
# No workflow-level path filter: the `infra` job at the bottom is the required check and must
# report even on PRs that touch no infrastructure.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENV_DIR: infra/environments/floci
  COMPOSE_FILE: infra/environments/floci/compose.yaml

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fork_point="$(git merge-base "$BASE" "$GITHUB_SHA" 2>/dev/null || echo "$BASE")"
          if git diff --name-only "$fork_point" "$GITHUB_SHA" | grep -qE '^(infra/|\.github/workflows/infra\.yml$)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          # The wrapper only exposes stdout/exit code as step outputs, which no step here uses.
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive -diff infra

      - name: Init and validate
        working-directory: ${{ env.ENV_DIR }}
        run: |
          tofu init -input=false
          tofu validate

      # Floci is ephemeral, so there is no deployed state to diff against: this is the plan
      # for creating the whole environment from nothing. It needs no Floci to compute.
      - name: Plan
        working-directory: ${{ env.ENV_DIR }}
        run: |
          if ! tofu plan -input=false -no-color > plan.txt 2>&1; then
            cat plan.txt
            exit 1
          fi
          cat plan.txt
          {
            echo "### OpenTofu plan (environments/floci)"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the plan on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- infra-plan -->';
            const limit = 60000;
            let plan = fs.readFileSync(process.env.ENV_DIR + '/plan.txt', 'utf8');
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n... truncated; see the job summary for the tail ...';
            }
            const body = marker + '\n### OpenTofu plan (environments/floci)\n' +
              'Plan for creating the whole environment from nothing (Floci is ephemeral, so there is no deployed state to diff against).\n\n' +
              '<details><summary>Show plan</summary>\n\n```\n' + plan + '\n```\n</details>';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  smoke:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          # The wrapper only exposes stdout/exit code as step outputs, which no step here uses.
          tofu_wrapper: false

      # Same compose file used locally, so Floci's config has one source of truth.
      - name: Start Floci
        run: |
          docker compose up -d floci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4566/_floci/health >/dev/null && exit 0
            sleep 2
          done
          echo "Floci did not become healthy"
          exit 1

      - name: Init
        working-directory: ${{ env.ENV_DIR }}
        run: tofu init -input=false

      - name: Apply from scratch
        working-directory: ${{ env.ENV_DIR }}
        run: tofu apply -input=false -auto-approve

      # Exit code 2 means the plan still has changes: the config is not idempotent.
      - name: Re-plan must show no changes
        working-directory: ${{ env.ENV_DIR }}
        run: tofu plan -input=false -detailed-exitcode

      - name: Destroy
        working-directory: ${{ env.ENV_DIR }}
        run: tofu destroy -input=false -auto-approve

      - name: Floci logs on failure
        if: failure()
        run: docker compose logs floci

      - name: Stop Floci
        if: always()
        run: docker compose down -v

  # The single required check. Runs even when nothing changed or a job failed.
  infra:
    needs: [changes, plan, smoke]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          PLAN: ${{ needs.plan.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          echo "changes=$CHANGES plan=$PLAN smoke=$SMOKE"
          [ "$CHANGES" = "success" ] || exit 1
          for r in "$PLAN" "$SMOKE"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
