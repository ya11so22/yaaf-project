name: build

# Builds the app services whose folder changed, and on main publishes them and opens the pin bump (ADR-0023, ADR-0024).
#   pull request: build, scan and gate each changed service; nothing is pushed.
#   main:         the same, then push by digest with provenance and an SBOM, then open (or update) the bot's pull
#                 request that pins the new digests in deploy/dev, which Argo CD deploys once it merges.
#
# No workflow-level path filter on purpose: the `build` job below is the required check, and a path-filtered workflow
# would never report it on pull requests that touch no service.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          matrix="$(bash .github/scripts/changed-services.sh "$BASE" "$GITHUB_SHA")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "Services to build: $matrix" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    # GitHub resolves a job-level reusable workflow call from this commit, not from a checkout, so ./ is not the risk it
    # is for step-level local actions. The newer $/ syntax (GitHub, July 2026) says the same thing explicitly; switch to
    # it once actionlint accepts it (v1.7.12 does not).
    uses: ./.github/workflows/reusable-container-image.yml # zizmor: ignore[self-repository]
    with:
      service: ${{ matrix.service }}
      context: ${{ matrix.context }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # After a successful build on main: one bot pull request that pins every service to its content tag and digest.
  # A pull request made with GITHUB_TOKEN would not trigger the required checks, so it is made as the GitHub App bot.
  # It checks out this pushed commit of main only, never code from a pull request.
  pins:
    needs: [changes, image]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    concurrency:
      group: pins
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The bot pushes its branch with this token, so the checkout keeps it (the one place credentials persist).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the bot pushes its branch with this token
          token: ${{ steps.app.outputs.token }}

      - name: Pin the digests and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          export BOT_NAME="${APP_SLUG}[bot]"
          export BOT_EMAIL="${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          bash .github/scripts/bump-pr.sh

  # The single required check. Runs even when no service changed or a job failed, and fails unless everything it depends
  # on succeeded or was legitimately skipped.
  build:
    needs: [changes, image, pins]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PINS: ${{ needs.pins.result }}
        run: |
          echo "changes=$CHANGES image=$IMAGE_RESULT pins=$PINS"
          [ "$CHANGES" = "success" ] || exit 1
          for r in "$IMAGE_RESULT" "$PINS"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
