name: environment

# The whole environment, built from git on a fresh arm64 runner (PLAN.md D31, D32): Floci, the three OpenTofu roots, Argo CD
# tracking the commit under test, and every Application Synced and Healthy with the shop and Argo CD answering; then torn
# down. On pull requests that change what it builds, it is the deploy check; after every merge to main it is continuous
# verification, the evidence that stands in for a long-lived production. Its duration is the platform's measured
# recovery time. arm64 because the images are (PLAN.md D27); cgroup v2, which Kubernetes needs, is checked before
# anything runs.
#
# No workflow-level path filter: the `environment` job at the bottom is a required check and must report on every PR. The
# rebuild itself runs only when a PR changes what it builds, and always on main and by hand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rebuild: ${{ steps.detect.outputs.rebuild }}
    steps:
      # main and manual runs always rebuild (continuous verification), so only a pull request needs the history.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "rebuild=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "rebuild=$(bash .github/scripts/changed-paths.sh "$BASE" "$GITHUB_SHA" \
            '^(deploy/|infra/|\.mise/tasks/|mise\.toml$|mise\.lock$|\.github/(workflows/environment\.yml|scripts/changed-paths\.sh)$)')" \
            >> "$GITHUB_OUTPUT"

  rebuild:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The commit Argo CD will track, not GitHub's merge ref, so OpenTofu and Argo CD build from the same tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Kubernetes 1.35+ refuses cgroup v1, and 11 images plus k3s need room on the runner's 14 GB disk.
      - name: Preflight (cgroup v2, disk)
        run: |
          echo "::error::planted fault: the rebuild fails here, so the environment gate must go red"; exit 1
          fs="$(stat -fc %T /sys/fs/cgroup)"; free_gb="$(df -BG --output=avail / | tail -1 | tr -dc 0-9)"
          echo "cgroup filesystem: $fs; free disk: ${free_gb} GB"
          [ "$fs" = "cgroup2fs" ] || { echo "::error::this runner has cgroup v1; Kubernetes cannot run here"; exit 1; }
          [ "$free_gb" -ge 8 ] || { echo "::error::only ${free_gb} GB free; the environment needs about 8"; exit 1; }

      # Every tool at the version and checksum in mise.lock (PLAN.md D25). `mise run` installs any missing tool itself,
      # so limiting this step saves nothing (seen 2026-10-08: about a second).
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      # Argo CD pulls this commit from GitHub, so a pull request is checked as it would deploy. The images are the pinned
      # ones in deploy/dev (pull requests never push images, PLAN.md D24).
      - name: Build the environment from nothing
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          start=$SECONDS
          mise run up --revision "$REVISION" --strict
          echo "### Environment built from git in $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision \`$REVISION\`: every Application Synced and Healthy; the shop and Argo CD answered." >> "$GITHUB_STEP_SUMMARY"

      # Also on a timeout, which cancels the job: that is when the cluster state matters most.
      - name: What the cluster looked like
        if: failure() || cancelled()
        run: |
          kubectl get applications -n argocd -o wide || true
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 40 || true

      - name: Tear down
        if: always()
        run: mise run down || true

  # The single required check (PLAN.md D24). Runs even when nothing relevant changed or a job failed.
  environment:
    needs: [changes, rebuild]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          REBUILD: ${{ needs.rebuild.result }}
        run: |
          echo "changes=$CHANGES rebuild=$REBUILD"
          [ "$CHANGES" = "success" ] || exit 1
          [ "$REBUILD" = "success" ] || [ "$REBUILD" = "skipped" ] || exit 1
