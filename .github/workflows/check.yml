name: check

# The same fast checks as the local pre-commit hook (ADR-0009), run as the source of truth: formatting, the script tests,
# manifest schemas, workflow security (zizmor, online here) and lint (actionlint), and a full-history secret scan.
# Always runs, so it can be a required check on every PR.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history so gitleaks scans every commit, not just the tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every tool at the version and checksum in mise.lock, and the environment from mise.toml (ADR-0025).
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Run the checks
        env:
          # Read-only; lets zizmor ask GitHub about impostor commits and actions with known vulnerabilities.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check --ci
