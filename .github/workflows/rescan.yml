name: rescan

# Weekly: scan the images that are deployed, by the digests pinned in deploy/dev (ADR-0024). New CVEs are published after
# an image is built, so a scan at build time alone goes stale. Results replace the build-time results for each service in
# the Security tab (same category), so the tab always describes what runs. Report-only: the fix is a rebuild, which the
# build gate then checks.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every image Argo CD deploys, as rendered from the committed pins.
      - id: list
        run: |
          matrix="$(kubectl kustomize deploy/dev | grep -o 'image: ghcr.io/[^ ]*' | sed 's/image: //' | sort -u |
            python3 -c 'import sys,json; print(json.dumps([{"service": l.split("/")[-1].split(":")[0], "ref": l.strip()} for l in sys.stdin if l.strip()]))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: pins
    name: scan (${{ matrix.service }})
    runs-on: ubuntu-24.04-arm # the images are arm64 (ADR-0027); an amd64 runner cannot scan them without naming a platform
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pins.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Trivy as the build gate: the version and checksum in mise.lock (ADR-0025), so the two cannot disagree.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: trivy

      - env:
          REF: ${{ matrix.ref }}
        run: |
          trivy image --format sarif --output trivy.sarif --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$REF"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}
