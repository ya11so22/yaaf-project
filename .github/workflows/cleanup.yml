name: cleanup

# GHCR has no lifecycle policy (unlike the ECR module), so keep only the newest 10 versions of
# each service image (ADR-0007). Verified 2026-09-20 by a manual run: the package-name format
# `yaaf-project/<service>` is accepted and the built-in token may manage the packages. Deletion
# itself is untested until a package exceeds 10 versions.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An empty base makes the script list every service that has a Dockerfile.
      - id: list
        run: echo "matrix=$(bash .github/scripts/changed-services.sh '' HEAD)" >> "$GITHUB_OUTPUT"

  prune:
    needs: services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.services.outputs.matrix) }}
    name: prune (${{ matrix.service }})
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: yaaf-project/${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 10
          # The action deletes only 1 old version per run by default, which would let retention fall
          # behind; allow it to prune everything beyond the newest 10 in one pass.
          num-old-versions-to-delete: 100
