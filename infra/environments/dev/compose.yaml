# The local AWS (PLAN.md D22): Floci. Started by `up` and removed by `down` (infra/README.md), and used as-is by CI for a
# fresh Floci per run. Pinned by digest; Dependabot proposes bumps.
name: floci

services:
  floci:
    # Floci 2.1.0 (MIT, github.com/floci-io/floci). The image ships its own healthcheck, which `up --wait` uses.
    image: floci/floci@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    container_name: floci
    # Never restarted on its own: Floci keeps nothing (below), so a restarted Floci would be empty while the cluster
    # containers it started are still there. A stopped Floci stays stopped, and `up` rebuilds everything (PLAN.md D39).
    restart: "no"
    ports:
      # Loopback only. Floci holds the Docker socket (it starts Lambda, RDS and EKS as containers), so anyone who
      # could reach this port from the network could start containers on this machine.
      - "127.0.0.1:4566:4566"
      # The ingress ALB's listener. Floci binds listener sockets on its own host, so the port is published here.
      - "127.0.0.1:${INGRESS_PORT:?set by mise.toml; run through mise}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Nothing is kept: the AWS, and the OpenTofu state in its S3 bucket, live only as long as this container. Every
      # environment is built from git (PLAN.md D39). `memory` is Floci's default, set here so the choice is visible.
      FLOCI_STORAGE_MODE: memory
      # Added on Windows, where Docker Desktop could not resolve the default *.localhost registry host names, so ECR uses
      # localhost:4566/<account>/<region>/<repo> URIs instead. Not yet retested anywhere else; keep it until a
      # run without it shows ECR pushes still work.
      FLOCI_SERVICES_ECR_URI_STYLE: path
      # Floci does no Kubernetes version mapping: every EKS cluster runs this k3s image, whatever version is asked
      # for. It comes from mise.toml (K3S_IMAGE), next to the Kubernetes minor it matches (PLAN.md D25), so run docker
      # compose through mise.
      FLOCI_SERVICES_EKS_DEFAULT_IMAGE: ${K3S_IMAGE:?set by mise.toml; run through mise}
      # The cluster containers Floci starts join this network, so the k3s API server can reach Floci's IAM
      # authenticator and the ALB can reach the node.
      FLOCI_SERVICES_EKS_DOCKER_NETWORK: floci-net
    networks:
      - floci-net

networks:
  floci-net:
    name: floci-net
