name: floci

services:
  floci:
    # Pinned by digest (Floci v2.1.0); bump deliberately. restart keeps the emulator up across
    # machine restarts (ADR-0014). The image ships its own healthcheck, which `up --wait` uses.
    image: floci/floci@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    container_name: floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_STORAGE_MODE: persistent
      # Docker Desktop on Windows can't resolve the default *.localhost registry hostnames,
      # so use localhost:4566/<account>/<region>/<repo> URIs instead.
      FLOCI_SERVICES_ECR_URI_STYLE: path
      # Floci does no version mapping: the k3s image it launches is this tag, whatever
      # kubernetes_version the module requests. Keep in step with modules/eks-cluster.
      FLOCI_SERVICES_EKS_DEFAULT_IMAGE: rancher/k3s:v1.36.4-k3s1
      # Cluster containers Floci spawns join this network so the k3s API server can reach
      # Floci's IAM token webhook.
      FLOCI_SERVICES_EKS_DOCKER_NETWORK: floci-net
    networks:
      - floci-net

  floci-ui:
    image: floci/floci-ui@sha256:f3a2d38bbc306409bcada19efba092721216f315dcb27c2658551d7d29d5f9bb
    container_name: floci-ui
    restart: unless-stopped
    ports:
      - "4500:4500"
    environment:
      PORT: "4500"
      FLOCI_CLOUD: aws
      FLOCI_HOSTNAME: floci
      FLOCI_ENDPOINT: http://floci:4566
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_SESSION_TOKEN: test
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - floci-net

volumes:
  floci-data:

networks:
  floci-net:
    name: floci-net
