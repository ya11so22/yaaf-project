# The shop at http://shop.localhost:18080 (ADR-0029). No namespace: Argo CD deploys it into the app's, and the route attaches to
# the platform's Gateway in the traefik namespace (see deploy/routes/argocd.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - shop.localhost
  rules:
    - backendRefs:
        - name: frontend
          port: 80
