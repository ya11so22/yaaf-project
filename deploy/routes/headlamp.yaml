# The cluster dashboard at http://headlamp.localhost:18080 (ADR-0029). See argocd.yaml for how routes attach to the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - headlamp.localhost
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
