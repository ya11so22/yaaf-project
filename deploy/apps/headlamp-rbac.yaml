# The read-only role Headlamp runs as, from deploy/headlamp-rbac. Cluster-scoped, so the namespace is only where Argo CD records
# the Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-rbac
  namespace: argocd
  labels:
    yaaf/source: repo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev
  source:
    repoURL: https://github.com/ya11so22/yaaf-project.git
    targetRevision: main
    path: deploy/headlamp-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
