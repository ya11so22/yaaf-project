# Everything Argo CD runs besides itself, one Application per file (PLAN.md D26). The root Application `platform`, created by
# OpenTofu, points here; adding a platform component is adding a file and opening a pull request.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway-api-crds.yaml
  - traefik.yaml
  - routes.yaml
  - shop.yaml
