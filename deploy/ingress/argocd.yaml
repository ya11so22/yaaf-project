# Argo CD's UI and API at http://argocd.localhost:8080 (ADR-0016). Argo CD serves plain HTTP on port 80
# because the chart sets server.insecure; there is no TLS between Traefik and it locally.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
