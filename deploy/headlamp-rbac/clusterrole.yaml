# The read-only role Headlamp runs as (ADR-0013, decision 8). The built-in "view" role omits nodes and
# every custom resource, so the dashboard reported "forbidden" for them. This grants read access
# (get, list, watch) to what a cluster dashboard shows, and deliberately not to secrets, pod exec or
# node proxy: the core group is listed resource by resource, and secrets exist only in the core group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-viewer
rules:
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  # Every other API group in the cluster, plus Gateway API and volume snapshots, which Headlamp
  # probes for whether or not they are installed (Kubernetes authorizes before it checks existence).
  # authentication.k8s.io and authorization.k8s.io are create-only review APIs and are left out.
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - argoproj.io
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - gateway.networking.k8s.io
      - helm.cattle.io
      - k3s.cattle.io
      - metrics.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: [get, list, watch]
